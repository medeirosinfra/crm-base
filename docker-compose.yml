services:
  app:
    build: .
    container_name: medeirosinfra-suite
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - medeirosinfra

networks:
  medeirosinfra:
    driver: bridge
